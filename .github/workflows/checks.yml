name: checks

on:
  push:
  pull_request:

jobs:
  game-and-i18n-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Game catalogue
        run: node docs/superpowers/check-games.js js/togame.js
      - name: i18n pairs
        shell: bash
        run: |
          set -e
          for pair in \
            "js/topalm.js routes/palm.html" \
            "js/towipi.js routes/wipi.html" \
            "js/tora2.js routes/ra2.html" \
            "js/todiablo.js routes/diablo.html" \
            "js/toz2rs.js routes/z2rs.html" \
            "js/towebgame.js routes/webgame.html" \
            "js/tops2.js routes/ps2.html" \
            "js/tovita.js routes/vita.html" \
            "js/tomac.js routes/mac.html" \
            "js/tork86.js routes/rk86.html" \
            "js/toesty.js routes/esty.html" \
            "js/toandroid.js routes/android.html" \
            "js/tofelt.js routes/feltworld.html" \
            "js/tonova.js routes/nova.html" \
            "js/tocasa.js routes/casa.html" \
            "js/totamaweb.js routes/tamaweb.html" \
            "js/ton64recomp.js routes/n64recomp.html" \
            "js/tobrowserport.js routes/browserport.html" \\
            "js/todos.js routes/dos.html" \\
            "js/toflash.js routes/flash.html" \\
            "js/tov86.js routes/v86.html" \\
            "js/towasm4.js routes/wasm4.html" \\
            "js/emulatorjs.js routes/emulatorjs.html"; do
            node docs/superpowers/check-i18n.js $pair
          done
      - name: Index DOM structure
        run: node docs/superpowers/check-index-dom.js
      - name: Game regressions
        run: node docs/superpowers/check-game-regressions.js
      - name: Proxy config
        run: node docs/superpowers/check-proxy-config.js
      - name: Proxy health cache
        run: node docs/superpowers/check-proxy-health.js
      - name: Language selector
        run: node docs/superpowers/check-language-selector.js
      - name: Local media and PDF regressions
        shell: bash
        run: |
          set -e
          node docs/superpowers/check-local-media.js
          node docs/superpowers/check-local-media-behavior.js
          node docs/superpowers/check-pdf-grouping.js
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          # Every page script, not just the game modules: these files are not
          # bundled, so a syntax error only shows up in the browser.
          for file in js/*.js docs/superpowers/*.js; do
            node --check "$file"
          done
