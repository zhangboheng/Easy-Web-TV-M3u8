name: checks

on:
  push:
  pull_request:

jobs:
  game-and-i18n-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Game catalogue
        run: node docs/superpowers/check-games.js js/togame.js
      - name: i18n pairs
        shell: bash
        run: |
          set -e
          for pair in \
            "js/topalm.js routes/palm.html" \
            "js/towipi.js routes/wipi.html" \
            "js/tora2.js routes/ra2.html" \
            "js/todiablo.js routes/diablo.html" \
            "js/toz2rs.js routes/z2rs.html" \
            "js/towebgame.js routes/webgame.html" \
            "js/tops2.js routes/ps2.html" \
            "js/tovita.js routes/vita.html" \
            "js/tomac.js routes/mac.html" \
            "js/tork86.js routes/rk86.html" \
            "js/toesty.js routes/esty.html" \
            "js/toandroid.js routes/android.html" \
            "js/tofelt.js routes/feltworld.html" \
            "js/tonova.js routes/nova.html" \
            "js/tocasa.js routes/casa.html" \
            "js/totamaweb.js routes/tamaweb.html" \
            "js/ton64recomp.js routes/n64recomp.html"; do
            node docs/superpowers/check-i18n.js $pair
          done
      - name: Game regressions
        run: node docs/superpowers/check-game-regressions.js
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in js/togame.js js/tovita.js js/tops2.js js/tomac.js js/tork86.js js/toesty.js js/toandroid.js js/tofelt.js js/tonova.js js/tocasa.js js/totamaweb.js js/towebgame.js js/ton64recomp.js; do
            node --check "$file"
          done
