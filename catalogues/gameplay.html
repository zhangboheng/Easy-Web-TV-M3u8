<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Play Game - Easy Web TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="Zhang Boheng">
    <meta name="keywords" content="iptv, movie, github, online tv, web tv, series tv, games">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="../css/main.css" rel="stylesheet" />
    
    <style>
        /* Reset main.css conflicts */
        .gameplay-container,
        .gameplay-container * {
            float: none !important;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background-image: url("../images/bg.jpg");
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        /* Main Container */
        .gameplay-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Top Header: same frosted-glass chrome as the other player pages'
           .top-toolbar (tvplay/radioplay/complay/adultplay/...). Position
           stays fixed because .game-frame-container offsets below it and the
           fullscreen hover-reveal logic targets this element. */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(163,0,27,0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .header-btn:hover {
            background: linear-gradient(135deg, #a3001b 0%, #8a0016 100%);
            border-color: #a3001b;
            transform: scale(1.05);
        }
        
        .header-btn i {
            color: #a3001b;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        
        .header-btn:hover i {
            color: #fff;
        }
        
        .header-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-title i {
            color: #a3001b;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Control Buttons */
        .control-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(163,0,27,0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn:hover {
            background: linear-gradient(135deg, #a3001b 0%, #8a0016 100%);
            border-color: #a3001b;
            transform: translateY(-2px);
        }
        
        .control-btn i {
            color: #a3001b;
            transition: color 0.3s ease;
        }
        
        .control-btn:hover i {
            color: #fff;
        }
        
        .control-btn.primary {
            background: linear-gradient(135deg, #a3001b 0%, #8a0016 100%);
            border-color: #a3001b;
        }
        
        .control-btn.primary i {
            color: #fff;
        }
        
        .control-btn.primary:hover {
            background: linear-gradient(135deg, #8a0016 0%, #6a0012 100%);
            box-shadow: 0 5px 20px rgba(163,0,27,0.4);
        }
        
        /* Game Info */
        .game-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 15px;
            border-left: 2px solid rgba(163,0,27,0.3);
            margin-left: 10px;
        }
        
        .game-info .game-name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        
        .game-info .game-category {
            background: rgba(163,0,27,0.2);
            padding: 4px 10px;
            border-radius: 8px;
            color: #a3001b;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        /* Game Frame Container */
        .game-frame-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: calc(100vh - 60px);
            background: rgba(0,0,0,0.3);
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            display: block;
        }

        /* Loading overlay / stalled fallback (shared with the other players) */
        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #a3001b;
            border-radius: 50%;
            animation: gameplay-spin 1s linear infinite;
        }

        @keyframes gameplay-spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 500;
        }

        .loading-text small {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
        }

        .hotlink-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            max-width: min(90vw, 520px);
        }

        .hotlink-fallback-message {
            margin: 0;
            color: rgba(255, 255, 255, 0.92);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .hotlink-retry {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 6px;
            background: rgba(163, 0, 27, 0.85);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .hotlink-retry:hover {
            background: #a3001b;
        }

        /* Toast used by the shared player for slow/stalled loads */
        .toast {
            position: fixed;
            top: 78px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(163, 0, 27, 0.7);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            max-width: min(90vw, 520px);
        }

        .toast i {
            color: #a3001b;
        }

        .control-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .control-btn:disabled:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(163,0,27,0.5);
        }

        /* Keyboard focus must stay visible on the dark chrome: the header buttons
           are real buttons now, and the UA ring is invisible on this background. */
        .header-btn:focus-visible,
        .control-btn:focus-visible,
        .hotlink-retry:focus-visible {
            outline: 2px solid #ffc93c;
            outline-offset: 2px;
        }
        
        /* Fullscreen Mode */
        .gameplay-container.fullscreen .top-header {
            opacity: 0;
            transform: translateY(-100%);
            transition: all 0.3s ease;
        }
        
        /* Native fullscreen: the fullscreen element becomes the containing block
           of this fixed frame, so the header offset (top: 60px / 50px) has to
           be removed or a dark strip is left above the game. */
        .gameplay-container.fullscreen .game-frame-container,
        .gameplay-container:fullscreen .game-frame-container {
            top: 0;
            bottom: 0;
            height: auto;
            margin-top: 0;
        }
        
        .gameplay-container.fullscreen:hover .top-header {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Responsive */
        @media screen and (max-width: 768px) {
            .top-header {
                height: 50px;
                padding: 0 10px;
            }
            
            .header-title {
                font-size: 14px;
            }
            
            .game-info {
                display: none;
            }
            
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            
            .control-btn span {
                display: none;
            }
            
            .game-frame-container {
                top: 50px;
                height: calc(100vh - 50px);
            }
        }
        
        @media screen and (max-width: 480px) {
            .header-btn {
                width: 35px;
                height: 35px;
            }
            
            .header-btn i {
                font-size: 14px;
            }
            
            .control-btn {
                padding: 6px 10px;
            }
        }
        
        /* Hide old elements */
        #left, #right, #div1, #control, #menuicon, #player, #prev, .toggle, .itemContainer, .hiddens, .loadingimg, .ready-player-1, audio {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="gameplay-container" id="gameplayContainer">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <div class="header-btn" id="backBtn" role="button" tabindex="0" data-i18n-title="back" title="Back to games">
                    <i class="fas fa-arrow-left"></i>
                </div>
                <div class="header-btn" id="homeBtn" role="button" tabindex="0" data-i18n-title="home" title="Home">
                    <i class="fas fa-home"></i>
                </div>
                <div class="header-title">
                    <i class="fas fa-gamepad"></i>
                    <span id="gameTitle" data-i18n="pageTitle">Game</span>
                </div>
            </div>
            <div class="header-right">
                <div class="game-info" id="gameInfo">
                    <span class="game-category" id="gameCategory">-</span>
                </div>
                <button class="control-btn" id="restartBtn" data-i18n-title="restart" title="Restart">
                    <i class="fas fa-redo"></i>
                    <span data-i18n="restart">Restart</span>
                </button>
                <button class="control-btn" id="fullscreenBtn" data-i18n-title="fullscreen" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                    <span data-i18n="fullscreen">Fullscreen</span>
                </button>
            </div>
        </header>
        
        <!-- Game Frame Container -->
        <div class="game-frame-container">
            <iframe id="gameFrame" class="game-frame" title="Game player" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals" allow="fullscreen; autoplay"></iframe>

            <!-- Loading Overlay: shown by js/hotlink-player.js until the frame loads -->
            <div class="loading-overlay hidden" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">
                    <span data-i18n="loading">Loading game...</span>
                    <small data-i18n="loadingTip">The game loads from the local bundle; the first launch can take a moment</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast: slow / stalled load hints from the shared player -->
    <div class="toast hidden" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="../js/hotlink-player.js"></script>
    <script src="../js/togameplay.js"></script>
</body>

</html>
