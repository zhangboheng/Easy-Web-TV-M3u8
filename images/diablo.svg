<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- screen: Diablo style (dark dungeon floor, ember glow, pentagram) -->
  <rect x="42" y="22" width="116" height="66" rx="6" fill="#1a0b0b"/>
  <rect x="42" y="52" width="116" height="36" rx="6" fill="#3d0f0f" opacity="0.55"/>
  <!-- stone arch -->
  <path d="M62 88 L62 52 Q70 36 84 52 L84 88 Z" fill="#2a1616" opacity="0.85"/>
  <path d="M96 88 L96 46 Q106 28 116 46 L116 88 Z" fill="#331a1a" opacity="0.7"/>
  <!-- pentagram -->
  <g stroke="#ff8c42" stroke-width="1.6" fill="none" opacity="0.95">
    <circle cx="128" cy="46" r="15"/>
    <polygon points="128,33 139,60.5 117.5,43 138.5,43 117,60.5"/>
  </g>
  <!-- embers -->
  <circle cx="60" cy="34" r="1.4" fill="#ffb347" opacity="0.9"/>
  <circle cx="76" cy="29" r="1" fill="#ffb347" opacity="0.7"/>
  <circle cx="146" cy="70" r="1.2" fill="#ffb347" opacity="0.6"/>
  <!-- soul stone -->
  <ellipse cx="52" cy="72" rx="6" ry="8" fill="#8b0000"/>
  <ellipse cx="52" cy="70" rx="2.6" ry="4" fill="#ff4444" opacity="0.8"/>
  <text x="132" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ff8c42">DIABLO</text>
  <circle cx="160" cy="97" r="4" fill="#33ff66"/>
</svg>