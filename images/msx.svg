<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- MSX rainbow stripes -->
  <g>
    <rect x="52" y="20" width="8" height="16" fill="#e60012"/>
    <rect x="60" y="20" width="8" height="16" fill="#eb6d00"/>
    <rect x="68" y="20" width="8" height="16" fill="#ffe100"/>
    <rect x="76" y="20" width="8" height="16" fill="#008d2d"/>
    <rect x="84" y="20" width="8" height="16" fill="#0052a5"/>
  </g>
  <!-- MSX pixel text -->
  <g fill="#fff">
    <rect x="104" y="22" width="6" height="12"/>
    <rect x="112" y="22" width="4" height="12"/>
    <rect x="114" y="30" width="6" height="4"/>
    <rect x="104" y="30" width="4" height="4"/>
    <rect x="126" y="22" width="14" height="4"/>
    <rect x="136" y="26" width="4" height="8"/>
    <rect x="126" y="30" width="10" height="4"/>
    <rect x="126" y="26" width="4" height="4"/>
    <rect x="146" y="22" width="6" height="12"/>
    <rect x="152" y="26" width="6" height="4"/>
    <rect x="158" y="22" width="6" height="12"/>
  </g>
  <!-- cartridge slot -->
  <rect x="52" y="44" width="96" height="36" rx="4" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="60" y="52" width="80" height="5" fill="#1c1c1c"/>
  <rect x="60" y="62" width="80" height="10" fill="#101010"/>
  <!-- game running hint: green power LED + red pixel -->
  <circle cx="70" cy="94" r="4" fill="#33ff66"/>
  <circle cx="86" cy="94" r="4" fill="#e60012"/>
  <rect x="106" y="90" width="34" height="9" rx="2" fill="#232323" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="160" cy="97" r="4" fill="#33ff66"/>
</svg>
