<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- PDA body (portrait) -->
  <rect x="72" y="16" width="56" height="88" rx="8" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- speaker slot -->
  <rect x="92" y="21" width="16" height="3" rx="1.5" fill="#232323"/>
  <!-- screen -->
  <rect x="78" y="27" width="44" height="38" rx="3" fill="#1d2b1d" stroke="#1c1c1c" stroke-width="1"/>
  <!-- text lines on screen (Palm OS launcher feel) -->
  <g fill="#33ff66">
    <rect x="82" y="32" width="26" height="3" rx="1"/>
    <rect x="82" y="38" width="34" height="3" rx="1"/>
    <rect x="82" y="44" width="20" height="3" rx="1"/>
    <rect x="82" y="50" width="30" height="3" rx="1" opacity="0.6"/>
    <rect x="82" y="56" width="14" height="3" rx="1" opacity="0.6"/>
  </g>
  <!-- graffiti area -->
  <rect x="78" y="68" width="44" height="8" rx="2" fill="#141414" stroke="#232323" stroke-width="0.8"/>
  <!-- hardware buttons -->
  <g fill="#232323" stroke="#3a3a3a" stroke-width="0.8">
    <circle cx="84" cy="84" r="4"/>
    <circle cx="96" cy="86" r="4"/>
    <circle cx="108" cy="86" r="4"/>
    <circle cx="120" cy="84" r="4"/>
  </g>
  <circle cx="100" cy="97" r="4" fill="#232323" stroke="#3a3a3a" stroke-width="0.8"/>
  <!-- stylus -->
  <rect x="140" y="24" width="4" height="72" rx="2" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="0.8"/>
  <polygon points="140,24 144,24 142,18" fill="#4a4a4a"/>
  <circle cx="160" cy="97" r="4" fill="#33ff66"/>
</svg>
