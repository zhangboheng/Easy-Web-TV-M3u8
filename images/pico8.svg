<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- PICO-8 style: 128x128 screen with the 16-colour palette as a bar -->
  <rect x="52" y="22" width="96" height="58" rx="4" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5"/>
  <g>
    <rect x="60" y="30" width="11" height="11" fill="#1D2B53"/>
    <rect x="71" y="30" width="11" height="11" fill="#7E2553"/>
    <rect x="82" y="30" width="11" height="11" fill="#008751"/>
    <rect x="93" y="30" width="11" height="11" fill="#AB5236"/>
    <rect x="104" y="30" width="11" height="11" fill="#5F574F"/>
    <rect x="115" y="30" width="11" height="11" fill="#C2C3C7"/>
    <rect x="126" y="30" width="11" height="11" fill="#FFF1E8"/>
    <rect x="137" y="30" width="11" height="11" fill="#FF004D"/>
    <rect x="60" y="41" width="11" height="11" fill="#FFA300"/>
    <rect x="71" y="41" width="11" height="11" fill="#FFEC27"/>
    <rect x="82" y="41" width="11" height="11" fill="#00E436"/>
    <rect x="93" y="41" width="11" height="11" fill="#29ADFF"/>
    <rect x="104" y="41" width="11" height="11" fill="#83769C"/>
    <rect x="115" y="41" width="11" height="11" fill="#FF77A8"/>
    <rect x="126" y="41" width="11" height="11" fill="#FFCCAA"/>
    <rect x="137" y="41" width="11" height="11" fill="#FFF1E8"/>
  </g>
  <!-- tiny "P8" pixel text on screen -->
  <g fill="#FFEC27">
    <rect x="76" y="60" width="4" height="14"/>
    <rect x="80" y="60" width="10" height="4"/>
    <rect x="80" y="66" width="8" height="4"/>
    <rect x="86" y="62" width="4" height="4"/>
    <rect x="80" y="70" width="10" height="4"/>
    <rect x="98" y="60" width="10" height="4"/>
    <rect x="104" y="62" width="4" height="4"/>
    <rect x="108" y="64" width="4" height="6"/>
    <rect x="104" y="70" width="10" height="4"/>
    <rect x="98" y="72" width="6" height="2"/>
  </g>
  <!-- console buttons: O/X + dpad hint, PICO-8 red accent -->
  <circle cx="70" cy="93" r="7" fill="none" stroke="#FF004D" stroke-width="2.5"/>
  <circle cx="90" cy="93" r="7" fill="none" stroke="#29ADFF" stroke-width="2.5"/>
  <rect x="118" y="88" width="9" height="4" fill="#5F574F"/>
  <rect x="121.5" y="84.5" width="4" height="9" fill="#5F574F"/>
  <rect x="134" y="88" width="9" height="4" fill="#5F574F"/>
  <rect x="137.5" y="84.5" width="4" height="9" fill="#5F574F"/>
  <circle cx="160" cy="97" r="4" fill="#33ff66"/>
</svg>
