<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- candybar phone body with stub antenna -->
  <rect x="70" y="18" width="52" height="84" rx="8" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="64" y="22" width="8" height="14" rx="3" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
  <!-- screen: WIPI logo plate -->
  <rect x="76" y="26" width="40" height="30" rx="3" fill="#123a4a" stroke="#1c1c1c" stroke-width="1"/>
  <text x="96" y="44" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#39c0ff" text-anchor="middle">WIPI</text>
  <rect x="80" y="49" width="32" height="2.5" rx="1" fill="#39c0ff" opacity="0.45"/>
  <!-- soft keys + d-pad row -->
  <g fill="#232323" stroke="#3a3a3a" stroke-width="0.8">
    <rect x="76" y="60" width="12" height="8" rx="2"/>
    <rect x="104" y="60" width="12" height="8" rx="2"/>
    <rect x="92" y="58" width="8" height="12" rx="2"/>
  </g>
  <!-- keypad grid -->
  <g fill="#232323" stroke="#3a3a3a" stroke-width="0.8">
    <rect x="78" y="72" width="11" height="7" rx="1.5"/>
    <rect x="91" y="72" width="11" height="7" rx="1.5"/>
    <rect x="104" y="72" width="11" height="7" rx="1.5"/>
    <rect x="78" y="81" width="11" height="7" rx="1.5"/>
    <rect x="91" y="81" width="11" height="7" rx="1.5"/>
    <rect x="104" y="81" width="11" height="7" rx="1.5"/>
    <rect x="78" y="90" width="11" height="7" rx="1.5"/>
    <rect x="91" y="90" width="11" height="7" rx="1.5"/>
    <rect x="104" y="90" width="11" height="7" rx="1.5"/>
  </g>
  <circle cx="160" cy="97" r="4" fill="#39c0ff"/>
</svg>
