<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <rect x="30" y="10" width="140" height="100" rx="12" fill="#161616" stroke="#3a3a3a" stroke-width="2"/>
  <!-- screen: Zelda II style (hyrule field, triforce, sword) -->
  <rect x="42" y="22" width="116" height="66" rx="6" fill="#12200f"/>
  <rect x="42" y="64" width="116" height="24" rx="6" fill="#1d3a15" opacity="0.9"/>
  <!-- triforce -->
  <g fill="#e8c547">
    <polygon points="128,30 134,40 122,40"/>
    <polygon points="121.5,41.5 127.5,51.5 115.5,51.5"/>
    <polygon points="134.5,41.5 140.5,51.5 128.5,51.5"/>
  </g>
  <!-- sword pointing up -->
  <g fill="#cfd8dc">
    <rect x="66" y="34" width="3" height="30"/>
    <polygon points="67.5,26 72,36 63,36"/>
    <rect x="60" y="63" width="15" height="3" rx="1" fill="#e8c547"/>
    <rect x="65" y="66" width="5" height="9" rx="1" fill="#8d6e63"/>
  </g>
  <!-- shield -->
  <path d="M92 34 L108 34 L108 52 Q100 64 92 52 Z" fill="#2e5d8a" stroke="#e8c547" stroke-width="1.6"/>
  <path d="M100 40 L104 47 L96 47 Z" fill="#e8c547" opacity="0.85"/>
  <!-- grass tufts -->
  <g stroke="#4caf50" stroke-width="1.3" opacity="0.8" fill="none">
    <path d="M52 80 L52 72 M56 80 L56 74 M60 80 L60 71"/>
    <path d="M144 82 L144 74 M148 82 L148 76"/>
  </g>
  <text x="128" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#e8c547">ZELDA</text>
  <circle cx="160" cy="97" r="4" fill="#33ff66"/>
</svg>